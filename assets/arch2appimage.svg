<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3050"/>
      <stop offset="1" stop-color="#1a1e2e"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a90ff"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>

  <!-- source package: outlined box (Arch pkg) -->
  <g stroke="#9aa0b9" stroke-width="8" fill="none" stroke-linejoin="round">
    <rect x="34" y="92" width="72" height="72" rx="10"/>
    <path d="M34 112 L106 112" stroke-width="6"/>
    <circle cx="70" cy="128" r="9" fill="#9aa0b9" stroke="none"/>
  </g>

  <!-- transform arrow -->
  <path d="M112 128 L150 128" stroke="#e7e9f2" stroke-width="12" stroke-linecap="round"/>
  <path d="M142 112 L162 128 L142 144 Z" fill="#e7e9f2"/>

  <!-- target: AppImage cube -->
  <g transform="translate(170,128)">
    <path d="M0 -44 L40 -22 L40 22 L0 44 L-40 22 L-40 -22 Z" fill="url(#cube)"/>
    <path d="M0 -44 L40 -22 L0 0 L-40 -22 Z" fill="#8aa8ff" opacity="0.9"/>
    <path d="M0 0 L40 -22 L40 22 L0 44 Z" fill="#3f6ae6" opacity="0.9"/>
    <!-- downward install arrow on the front face -->
    <path d="M0 -6 L0 20 M-11 9 L0 20 L11 9" stroke="#ffffff" stroke-width="7"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
